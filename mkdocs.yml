site_name: Anonymization Handbook
site_description: Open academic handbook on data anonymization, disclosure risk, and document sanitization — with the companion pdf-anonymizer and id-extract Python packages
site_author: Leonid
site_url: https://leo-gan.github.io/anonymizer/
repo_name: leo-gan/anonymizer
repo_url: https://github.com/leo-gan/anonymizer
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  font:
    text: IBM Plex Sans
    code: IBM Plex Mono
  palette:
    # Scheme mode: Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    # Scheme mode: Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to light mode

  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.indexes
    - navigation.instant
    - navigation.top
    - navigation.tracking
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
  icon:
    logo: material/shield-lock-outline

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/leo-gan/anonymizer
      name: GitHub Repository

extra_javascript:
  - https://unpkg.com/katex@0/dist/katex.min.js
  - https://unpkg.com/katex@0/dist/contrib/auto-render.min.js
  - javascripts/katex.js

extra_css:
  - https://unpkg.com/katex@0/dist/katex.min.css

markdown_extensions:
  - md_in_html
  - admonition
  - footnotes
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [packages/id-extract/src, packages/pdf-anonymizer-core/src, packages/pdf-anonymizer-cli/src, packages/pdf-anonymizer-api/src]
          options:
            show_source: true
            show_root_heading: true
            heading_level: 2
            docstring_style: google
            members_order: alphabetical
            show_signature_annotations: true

# Internal maintainer notes under docs/internal/ must never ship to GitHub Pages.
exclude_docs: |
  /internal/
  /temp/

validation:
  links:
    anchors: warn

nav:
  - Home: index.md
  - Handbook:
    - 101/index.md
    - 1. Problem, Threats, and Law: 101/why-anonymization.md
    - 2. Historical Development: 101/history.md
    - 3. Formal Models and Methods: 101/techniques.md
    - 4. Attacker Models and Risk: 101/risk-and-attackers.md
    - 5. Document & File-Format Leakage: 101/document-leakage.md
    - 6. Pseudonymization & Crypto: 101/pseudonymization-crypto.md
    - 7. Evaluation & Benchmarks: 101/evaluation-and-benchmarks.md
    - 8. Choosing a Method: 101/decision-framework.md
    - 9. Case Study (pdf-anonymizer): 101/how-different.md
