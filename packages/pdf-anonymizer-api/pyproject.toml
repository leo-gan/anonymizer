[project]
name = "pdf-anonymizer-api"
version = "0.32.0"
description = "Self-hosted local FastAPI HTTP service wrapping pdf-anonymizer-core for reversible PII pseudonymization (no built-in authentication)."
authors = [{ name = "Leonid Ganeline", email = "leo.gan.57@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "anonymization",
    "pseudonymization",
    "pii",
    "privacy",
    "fastapi",
    "http",
    "docker",
    "llm-gateway",
    "gdpr",
    "hipaa",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]
dependencies = [
    "pdf-anonymizer-core>=0.32.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]

[project.urls]
Homepage = "https://leo-gan.github.io/anonymizer/"
Documentation = "https://leo-gan.github.io/anonymizer/project/http-service/"
Repository = "https://github.com/leo-gan/anonymizer"
Issues = "https://github.com/leo-gan/anonymizer/issues"

[project.scripts]
pdf-anonymizer-api = "pdf_anonymizer_api.server:main"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv.sources]
pdf-anonymizer-core = { workspace = true }
