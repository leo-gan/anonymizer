[project]
name = "pdf-anonymizer-core"
version = "0.32.0"
description = "Reversible, context-aware document and table pseudonymizer (RE2, local GLiNER NER, and local/remote LLMs) for PDF, DOCX, CSV, XLSX, Markdown, and text."
authors = [{ name = "Leonid Ganeline", email = "leo.gan.57@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
keywords = [
    "anonymization",
    "pseudonymization",
    "de-identification",
    "pii",
    "phi",
    "pdf",
    "docx",
    "gdpr",
    "hipaa",
    "irb",
    "privacy",
    "redaction",
    "llm",
    "ollama",
    "k-anonymity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "Intended Audience :: Legal Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Scientific/Engineering",
    "Topic :: Text Processing :: Linguistic",
]
dependencies = [
    "id-extract>=0.3.0",
    "python-dotenv",
    "pymupdf4llm",
    "langchain-text-splitters",
    "cryptography>=50.0.0",
    "faker>=40.36.0",
]

[project.optional-dependencies]
google = ["google-genai"]
ollama = ["ollama"]
huggingface = ["huggingface-hub"]
openrouter = ["openai"]
openai = ["openai"]
anthropic = ["anthropic"]
excel = ["openpyxl>=3.1"]
docx = ["python-docx>=1.1"]
ner = ["gliner>=0.2.13"]

[project.urls]
Homepage = "https://leo-gan.github.io/anonymizer/"
Documentation = "https://leo-gan.github.io/anonymizer/project/api-usage/"
Repository = "https://github.com/leo-gan/anonymizer"
Issues = "https://github.com/leo-gan/anonymizer/issues"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.uv.sources]
id-extract = { workspace = true }
