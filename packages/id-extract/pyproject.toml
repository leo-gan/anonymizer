[project]
name = "id-extract"
version = "0.2.0"
description = "Extract structured identifiers (IDs, cards, IBAN, email) with RE2 and checksums."
authors = [{ name = "Leonid Ganeline", email = "leo.gan.57@gmail.com" }]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-re2",
]

[project.urls]
repository = "https://github.com/leo-gan/anonymizer"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
