[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.uv]
workspace = { members = ["packages/*"] }

[tool.setuptools]
packages = []

[tool.uv.sources]
pdf-anonymizer-core = { workspace = true }
pdf-anonymizer-cli = { workspace = true }
pdf-anonymizer-api = { workspace = true }

[project]
name = "pdf-anonymizer-workspace"
version = "0.24.0"
dependencies = []

[project.optional-dependencies]
dev = ["ruff", "pytest", "pytest-mock", "pytest-cov", "hypothesis", "httpx"]

[dependency-groups]
# Use: `uv sync --group dev` to install a full dev environment including all providers
# Note: keep root runtime deps empty; install workspace members via path deps for dev only
dev = [
  "ruff",
  "pytest",
  "pytest-mock",
  "pytest-cov",
  "hypothesis",
  "pdf-anonymizer-core[huggingface,google,ollama,openrouter,openai,anthropic,excel,docx]",
  "pdf-anonymizer-cli",
  "pdf-anonymizer-api",
  "mkdocs>=1.5.0",
  "mkdocs-material>=9.5.0",
  "mkdocstrings[python]>=0.26",
]

[tool.pytest.ini_options]
pythonpath = [
  "packages/pdf-anonymizer-core/src",
  "packages/pdf-anonymizer-cli/src",
  "packages/pdf-anonymizer-api/src",
]
addopts = "--strict-markers"

[tool.coverage.report]
skip_empty = true
