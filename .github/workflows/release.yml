name: Release

# Create a GitHub Release (tag vX.Y.Z) to build both packages, attach
# wheels + SHA-256 sums, and publish to PyPI.
#
# PyPI uses Trusted Publishing (OIDC). No API token is stored in this repo.
# One-time setup on each PyPI project (id-extract, pdf-anonymizer-core,
# pdf-anonymizer-cli, and pdf-anonymizer-api): add a GitHub trusted publisher
#   owner: leo-gan
#   repository: anonymizer
#   workflow: release.yml
#   environment: pypi

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Build id-extract, core, CLI, and API
        run: |
          make build-id-extract
          make build-core
          make build-cli
          make build-api
          mkdir -p dist
          cp packages/id-extract/dist/* dist/
          cp packages/pdf-anonymizer-core/dist/* dist/
          cp packages/pdf-anonymizer-cli/dist/* dist/
          cp packages/pdf-anonymizer-api/dist/* dist/
          (cd dist && sha256sum * > SHA256SUMS)
          echo "### SHA-256" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat dist/SHA256SUMS >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-packages
          path: dist/

  attach-release-assets:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist

      - name: Attach wheels and checksums to the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ github.event.release.tag_name }}" dist/* \
            --repo "${{ github.repository }}" --clobber

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/pdf-anonymizer-cli/
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Download distributions
        uses: actions/download-artifact@v4
        with:
          name: python-packages
          path: dist

      - name: Split distributions by project
        run: |
          rm -f dist/SHA256SUMS
          mkdir -p dist-id-extract dist-core dist-cli dist-api
          mv dist/id_extract-* dist-id-extract/
          mv dist/pdf_anonymizer_core-* dist-core/
          mv dist/pdf_anonymizer_cli-* dist-cli/
          mv dist/pdf_anonymizer_api-* dist-api/

      # Existing PyPI projects. A new project name fails OIDC publish
      # until a pending trusted publisher exists for that exact name.
      - name: Publish pdf-anonymizer-core
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist-core

      - name: Publish pdf-anonymizer-cli
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist-cli

      - name: Publish pdf-anonymizer-api
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist-api

      - name: Publish id-extract
        continue-on-error: true
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true
          packages-dir: dist-id-extract
